[project]
name = "massacote-blog"
version = "0.1.0"
description = "This is a blog to talk about tech and other things I want."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.6",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.0.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "django-debug-toolbar>=7.0.0",
    "faker>=40.23.0",
    "ruff>=0.15.20",
    "whitenoise>=6.12.0",
]

[tool.coverage.run]
source = ["post", "account", "comment"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests/*",
    "manage.py",
    "*/admin.py",
    "*/apps.py",
    "*/urls.py",
    "*/management/commands/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import organization)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bugs)
    "DJ",  # flake8-django (Django-specific rules)
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"] # For not autogenerated migrations
"**/settings.py" = ["E501", "F403", "F405"] # Ignore wildcard imports in settings.py
"**/tests/*.py" = ["S101"]
"**/test_*.py" = ["S101"] # Ignore assert statements in test files
